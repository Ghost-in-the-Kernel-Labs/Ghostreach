<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture Dex | About</title></head>
<body>
  <header class="site-header">
    <nav class="main-nav"><ul><li><a href="/">Home</a></li></ul></nav>
  </header>
  <main>
    <h1>About</h1>
    <p>Fixture Dex is invented content. It copies the structure of a Pokédex site, nothing else.</p>
    <h2>Write to us</h2>
    <form action="/about" method="post">
      <label for="name">Name (required)</label> <input id="name" name="name" required>
      <label for="email">Email (required)</label> <input id="email" name="email" type="email" required>
      <label for="topic">Topic</label>
      <select id="topic" name="topic"><option>A question</option><option>A correction</option></select>
      <label for="message">Message</label> <textarea id="message" name="message"></textarea>
      <label><input type="checkbox" name="news"> Send me the newsletter</label>
      <button type="submit">Send</button>
    </form>
  </main>
</body>
</html>
