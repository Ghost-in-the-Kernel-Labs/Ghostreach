# The salesperson's install on Windows (TODO 5.2), run by hand only (C-032, P-13; Ghost, 2026-10-23: Actions minutes are
# scarce and spent strategically). No push, pull request or schedule starts a run. Once per release: build and pack the
# program, install the tarball, install Chromium, review the fixture site and read the PDF's text. The steps are
# test/crawl/package.spec.ts, run here on Windows: it packs, installs the tarball with npm under --ignore-scripts, and the
# installed `ghostreach` answers --help and doctor and reviews the fixture into a PDF whose text it reads.
# One action, the reviewed pin ci.yml holds (docs/REVIEWED-VERSIONS.md); Node is the runner's own (J-048).
name: windows
on:
  workflow_dispatch:
# Least privilege: the job reads the repository and nothing else.
permissions:
  contents: read
jobs:
  install-and-review:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Chromium in one known folder, which the spec hands to the installed command.
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\ms-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by SHA
        with:
          persist-credentials: false
      - name: Node from the runner's own tool cache, the newest in package.json's engines range that carries npm 11 (^24.11.0, or 26 and later)
        shell: pwsh
        run: |
          $node = Get-ChildItem (Join-Path $env:RUNNER_TOOL_CACHE 'node') -Directory |
            Where-Object { $v = [version]$_.Name; ($v.Major -eq 24 -and $v.Minor -ge 11) -or $v.Major -ge 26 } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $node) { throw "the runner's tool cache holds no Node.js in package.json's engines range" }
          Join-Path $node.FullName 'x64' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Node and npm (npm 11 or later, as the spec asks)
        run: node --version; npm --version
      - name: Install from the lockfile, no install script run
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Chromium, as the salesperson installs it
        run: npx --yes playwright@1.63.0 install chromium
      - name: Build, pack, install the tarball, review the fixture, read the PDF
        run: npx playwright test test/crawl/package.spec.ts
